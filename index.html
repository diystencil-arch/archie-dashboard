<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Archie Sample Dashboard</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f5f7;color:#222}
header{background:#1f2937;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
header h1{font-size:20px;margin:0} header span{font-size:12px;opacity:.8}
.wrap{padding:18px 22px}
#lock{max-width:340px;margin:12vh auto;background:#fff;padding:26px;border-radius:10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#lock input{width:100%;box-sizing:border-box;font-size:16px;padding:10px;margin:12px 0;border:1px solid #ccc;border-radius:8px}
button.b{background:#1f2937;color:#fff;border:0;padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer}
#err{color:#b91c1c;font-size:13px;min-height:18px}
#app{display:none}
#q{width:100%;max-width:520px;font-size:17px;padding:10px 14px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.counts{margin:14px 0;display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:14px;font-size:13px;cursor:pointer;border:1px solid #ddd;background:#fff}
.chip.on{outline:2px solid #1f2937}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}
th{background:#f0f1f3} tr:hover td{background:#f9fafb;cursor:pointer}
.st{padding:3px 9px;border-radius:10px;font-size:12px;white-space:nowrap}
.s-pending{background:#fef3c7}.s-sent{background:#dbeafe}.s-wait{background:#e0e7ff}.s-ok{background:#d1fae5}.s-fix{background:#fee2e2}
.flag{color:#b45309;font-size:12px}
a.dl{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap}
#pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
#card{background:#fff;border-radius:10px;padding:20px;max-width:960px;width:92%;display:flex;gap:22px;max-height:88vh;overflow:auto;flex-wrap:wrap}
#card .info{flex:1;min-width:240px} #card .img{flex:1.3;min-width:260px;text-align:center}
#card img{max-width:100%;border:1px solid #ddd;border-radius:6px}
#card dt{font-weight:600;font-size:12px;color:#666;margin-top:8px} #card dd{margin:2px 0 0 0}
.x{float:right;cursor:pointer;font-size:22px;border:0;background:none}
.none{color:#888;padding:40px;border:1px dashed #ccc;border-radius:6px}
.note{font-size:12px;color:#666;margin-top:6px}
</style><style>
#msgs{display:none}
.mc{background:#fff;border-radius:10px;padding:14px 16px;margin:0 0 14px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid #93c5fd}
.mc.dec{border-left-color:#f59e0b}
.mc h3{margin:0 0 4px 0;font-size:17px}
.mc .meta{font-size:13px;color:#555;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mc .ch{padding:2px 8px;border-radius:9px;font-size:12px;background:#e0e7ff}
.mc .ch.etsy{background:#ffedd5}
.mc .wait{font-weight:600;color:#b91c1c}
.mc .cm{background:#f8fafc;border:1px solid #eef0f3;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px;white-space:pre-wrap}
.mc .cm small{display:block;color:#888;font-size:11px;margin-bottom:2px}
.mc textarea{width:100%;box-sizing:border-box;min-height:90px;font:14px/1.45 Segoe UI,Arial,sans-serif;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
.mc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.cpy{background:#1f2937;color:#fff;border:0;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px}
.cpy.ok{background:#059669}
.tag{background:#eef2ff;color:#3730a3;border-radius:9px;padding:2px 8px;font-size:12px}
.mflag{color:#b45309;font-size:13px;margin-top:6px}
.dbadge{background:#fef3c7;color:#92400e;border-radius:9px;padding:2px 8px;font-size:12px;font-weight:600}
.mnote{font-size:12px;color:#666;margin-top:4px}
.mlink{font-size:12px;color:#2563eb;text-decoration:none}
.lt{margin:18px 0 8px 0;font-size:16px}
.le{background:#fff;border-radius:8px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.le b{font-size:14px}.le pre{white-space:pre-wrap;font:13px/1.45 Segoe UI,Arial,sans-serif;background:#f8fafc;border-radius:6px;padding:8px;margin:6px 0}
.le .src{font-size:11px;color:#777}
.msrc{font-size:12px;color:#666;margin:0 0 12px 0}
details.unv{background:#fff;border-radius:8px;padding:10px 14px;margin-top:18px}
details.unv summary{cursor:pointer;font-weight:600;font-size:14px}
details.unv table{margin-top:8px}
</style>
<script>
let MSG={conversations:[],etsy_unverified:[],library:{topics:[]}};
const MTABS=['Messages','Reply Library'];
const EDITS={};
const mesc=t=>(t==null?'':String(t)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function libCount(){return (MSG.library&&MSG.library.topics||[]).reduce((a,t)=>a+t.entries.length,0)}
function msgChips(cur){return [['Messages',(MSG.conversations||[]).length,'#dbeafe'],['Reply Library',libCount(),'#ede9fe']].map(([n,k,bg])=>'<span class="chip'+(cur==n?' on':'')+'" style="background:'+bg+'" data-s="'+n+'">'+(n=='Messages'?'✉ ':'📚 ')+n+' ('+k+')</span>').join('')}
function fmtET(iso){try{return new Date(iso).toLocaleString('en-US',{timeZone:'America/Toronto',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'}catch(e){return iso}}
function waited(iso){const ms=Date.now()-new Date(iso);if(!(ms>0))return '';const h=Math.floor(ms/36e5),d=Math.floor(h/24);return d?d+'d '+(h%24)+'h':h?h+'h':Math.max(1,Math.floor(ms/6e4))+'m'}
function copyText(t,btn){const done=()=>{btn.textContent='Copied ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent=btn.dataset.l;btn.classList.remove('ok')},1600)};
 const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb()}
function drawMsgBox(tab,q){const box=document.getElementById('msgs');q=(q||'').toLowerCase().trim();
 if(tab=='Messages'){
  const cs=[...(MSG.conversations||[])].sort((a,b)=>new Date(a.waiting_since)-new Date(b.waiting_since)).filter(c=>!q||[c.name,c.first_name,c.email,c.etsy_username,c.order_number].join(' ').toLowerCase().includes(q));
  let h='<div class="msrc">Outstanding conversations, oldest waiting first. Edit a draft, click <b>Copy reply</b>, then paste it into Etsy or Gmail. '+(MSG.generated?'Checked '+mesc(fmtET(MSG.generated))+'. ':'')+(MSG.sources&&MSG.sources.etsy_inbox&&/NOT/.test(MSG.sources.etsy_inbox)?'<b>Etsy inbox not checked in this pass.</b>':'')+'</div>';
  if(!cs.length)h+='<div class="none">'+(q?'No outstanding message for “'+mesc(q)+'”':'No outstanding customer messages 🎉')+'</div>';
  h+=cs.map((c,i)=>{const k=c.key||c.name;const d=EDITS[k]!=null?EDITS[k]:c.draft;const etsy=/etsy/i.test(c.channel);
   const links=[c.gmail_thread?'<a class="mlink" target="_blank" href="https://mail.google.com/mail/?authuser=diystencil@gmail.com#all/'+mesc(c.gmail_thread)+'">Open in Gmail</a>':'',c.etsy_url?'<a class="mlink" target="_blank" href="'+mesc(c.etsy_url)+'">Open Etsy conversation</a>':(etsy?'<a class="mlink" target="_blank" href="https://www.etsy.com/messages">Open Etsy Messages</a>':''),c.order_number?'<a class="mlink" target="_blank" href="https://www.etsy.com/your/orders/sold?order_id='+mesc(c.order_number)+'">Order #'+mesc(c.order_number)+'</a>':''].filter(Boolean).join(' · ');
   return '<div class="mc'+(c.decision_needed?' dec':'')+'"><h3>'+mesc(c.name)+(c.decision_needed?' <span class="dbadge">Decision needed</span>':'')+'</h3>'+
   '<div class="meta"><span class="ch'+(etsy?' etsy':'')+'">'+mesc(c.channel)+'</span>'+(c.order_number?'<span>Order #'+mesc(c.order_number)+'</span>':'')+(c.product?'<span>'+mesc(c.product)+'</span>':'')+'<span class="wait">Waiting '+waited(c.waiting_since)+'</span><span>since '+mesc(fmtET(c.waiting_since))+'</span></div>'+
   (c.messages||[]).map(m=>'<div class="cm"><small>'+mesc(fmtET(m.date))+'</small>'+mesc(m.text)+'</div>').join('')+
   '<textarea rows="'+Math.min(18,Math.max(5,String(d).split(\'\\n\').length+Math.ceil(String(d).length/140)+1))+'" data-k="'+mesc(k)+'" oninput="EDITS[this.dataset.k]=this.value">'+mesc(d)+'</textarea>'+
   '<div class="row"><button class="cpy" data-l="Copy reply" onclick="copyText(this.parentNode.previousElementSibling.value,this)">Copy reply</button>'+(c.topics||[]).map(t=>'<span class="tag">'+mesc(t)+'</span>').join('')+'</div>'+
   (c.flag?'<div class="mflag">⚑ '+mesc(c.flag)+'</div>':'')+(c.note?'<div class="mnote">'+mesc(c.note)+'</div>':'')+(links?'<div class="mnote">'+links+'</div>':'')+'</div>'}).join('');
  const u=(MSG.etsy_unverified||[]).filter(x=>!q||[x.name,x.order_number].join(' ').toLowerCase().includes(q));
  if(u.length)h+='<details class="unv"><summary>Etsy inbox not verified yet: '+u.length+' buyers messaged recently (from Etsy email alerts, message text only visible in Etsy)</summary><div class="tw"><table><thead><tr><th>Buyer</th><th>Order #</th><th>Last buyer message</th><th>Alerts</th><th>Note</th></tr></thead><tbody>'+[...u].sort((a,b)=>new Date(b.last_buyer_message)-new Date(a.last_buyer_message)).map(x=>'<tr><td>'+mesc(x.name)+'</td><td>'+mesc(x.order_number||'—')+'</td><td style="white-space:nowrap">'+mesc(fmtET(x.last_buyer_message))+'</td><td>'+mesc(x.buyer_messages_seen)+'</td><td>'+mesc(x.note||'')+'</td></tr>').join('')+'</tbody></table></div></details>';
  box.innerHTML=h;
 }else{
  let h='<div class="msrc">Reusable replies based on Archie\'s real messages. Replace {name} and anything in [brackets]. The search box filters by topic, title or text.</div>';let n=0;
  (MSG.library&&MSG.library.topics||[]).forEach(t=>{const es=t.entries.filter(e=>!q||[t.topic,e.title,e.text,(e.product_tags||[]).join(' ')].join(' ').toLowerCase().includes(q));if(!es.length)return;n+=es.length;
   h+='<h3 class="lt">'+mesc(t.topic)+' ('+es.length+')</h3>'+es.map(e=>'<div class="le"><b>'+mesc(e.title)+'</b> '+(e.product_tags||[]).map(x=>'<span class="tag">'+mesc(x)+'</span>').join(' ')+'<pre>'+mesc(e.text)+'</pre><div class="row"><button class="cpy" data-l="Copy" onclick="copyText(this.parentNode.previousElementSibling.textContent,this)">Copy</button><span class="src">Based on: '+mesc(e.source)+'</span></div></div>').join('')});
  if(!n)h+='<div class="none">No library entry matches “'+mesc(q)+'”</div>';
  box.innerHTML=h;}
}
</script>
</head><body>
<header><h1>Archie – Sample Approval Dashboard</h1><span id="upd"></span></header>
<div id="lock"><h3 style="margin:0">Team access</h3><input id="pw" type="password" placeholder="Password" autofocus><button class="b" id="go">Open dashboard</button><div id="err"></div></div>
<div id="app" class="wrap">
<input id="q" placeholder="Search customer name, email, or order #">
<div class="counts" id="counts"></div>
<div class="tw" id="tw"><table><thead><tr><th>Order #</th><th>Order date</th><th>Customer</th><th>Product</th><th>Email</th><th>Status</th><th>Notes</th><th>Sample</th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="msgs"></div>
</div>
<div id="pop"><div id="card"></div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let rows=[],filt=null;
async function unlock(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.d));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tryOpen(pw,remember){
 try{const p=await unlock(pw);rows=p.rows;if(p.messages)MSG=p.messages;document.getElementById('upd').textContent='Updated '+p.updated;
  if(remember)sessionStorage.setItem('adpw',pw);
  document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';counts();draw();document.getElementById('q').focus();}
 catch(e){document.getElementById('err').textContent='Wrong password';}}
document.getElementById('go').onclick=()=>tryOpen(document.getElementById('pw').value,true);
document.getElementById('pw').onkeydown=e=>{if(e.key=='Enter')tryOpen(e.target.value,true)};
if(sessionStorage.getItem('adpw'))tryOpen(sessionStorage.getItem('adpw'),false);
const cls=s=>/Pending/.test(s)?'s-pending':/Email Sent/.test(s)?'s-sent':/Waiting/.test(s)?'s-wait':/Approved/.test(s)?'s-ok':/Correction/.test(s)?'s-fix':'';
const esc=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=r=>(r.imgs&&r.imgs.length)?r.imgs.map((m,i)=>'<a class="dl" style="margin:2px" href="'+m.data+'" download="'+esc(r.order_number+' '+m.name)+'" onclick="event.stopPropagation()">⬇ '+(r.imgs.length>1?'Sample '+(i+1):'Download sample')+'</a>').join(' '):'<span class="note">—</span>';
const TABS=[['Sample Pending',r=>/Pending/.test(r.status)],['Sent',r=>/Email Sent|Waiting/.test(r.status)],['Correction Required',r=>/Correction/.test(r.status)],['Approved – Stencil',r=>/Approved/.test(r.status)],['All',r=>true]];
let tab='Sample Pending';
function counts(){document.getElementById('counts').innerHTML=TABS.map(([n,f])=>{const k=rows.filter(f).length;const c=n=='Sample Pending'?'s-pending':n=='Sent'?'s-wait':n.startsWith('Correction')?'s-fix':n.startsWith('Approved')?'s-ok':'';return '<span class="chip '+c+(tab==n?' on':'')+'" data-s="'+n+'">'+n+' ('+k+')</span>'}).join('')+msgChips(tab);
 document.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{tab=e.dataset.s;counts();draw()});}
function draw(){const q=document.getElementById('q').value.toLowerCase().trim();
 const _mt=MTABS.includes(tab);document.getElementById('tw').style.display=_mt?'none':'';document.getElementById('msgs').style.display=_mt?'block':'none';if(_mt){drawMsgBox(tab,q);return;}
 const m=[...rows].sort((a,b)=>new Date(b.order_date||0)-new Date(a.order_date||0)).filter(r=>((q?true:TABS.find(t=>t[0]==tab)[1](r)))&&(!q||[r.buyer_name,r.buyer_email,r.order_number,r.product].join(' ').toLowerCase().includes(q)));
 document.getElementById('tb').innerHTML=m.map(r=>'<tr data-o="'+r.order_number+'"><td>'+r.order_number+'</td><td style="white-space:nowrap">'+esc(r.order_date)+'</td><td>'+esc(r.buyer_name)+'</td><td>'+esc(r.product)+'</td><td>'+esc(r.buyer_email)+'</td><td><span class="st '+cls(r.status)+'">'+esc(r.status)+'</span></td><td>'+esc(r.customer_notes)+(r.flag?'<div class="flag">⚑ '+esc(r.flag)+'</div>':'')+'</td><td>'+dl(r)+'</td></tr>').join('');
 document.querySelectorAll('#tb tr').forEach(e=>e.onclick=()=>show(e.dataset.o));
 if(q&&m.length==1)show(m[0].order_number);}
function show(o){const r=rows.find(x=>x.order_number==o);
 const img=(r.imgs&&r.imgs.length)?r.imgs.map(m=>'<img src="'+m.data+'" style="margin-bottom:10px">').join('')+'<div style="margin-top:6px">'+dl(r)+'</div><div class="note">'+r.imgs.length+' image'+(r.imgs.length>1?'s':'')+'</div><div class="note">'+(r.img_state=='sent'?'This is the exact version emailed to the customer.':'Sample not sent to the customer yet.')+'</div>':'<div class="none">No sample yet</div>';
 document.getElementById('card').innerHTML='<div class="info"><button class="x" onclick="hide()">×</button><h2>'+esc(r.buyer_name)+'</h2><dl><dt>Order date</dt><dd>'+esc(r.order_date||'—')+'</dd><dt>Product</dt><dd>'+esc(r.product||'—')+'</dd><dt>Email</dt><dd>'+esc(r.buyer_email)+'</dd><dt>Etsy order</dt><dd><a href="https://www.etsy.com/your/orders/sold?order_id='+r.order_number+'" target="_blank">#'+r.order_number+'</a></dd><dt>Status</dt><dd><span class="st '+cls(r.status)+'">'+esc(r.status)+'</span></dd><dt>Etsy section</dt><dd>'+esc(r.etsy_section)+'</dd><dt>Sample version</dt><dd>'+esc(r.sample_version)+'</dd><dt>Last sent</dt><dd>'+esc(r.last_sent_at||'—')+'</dd><dt>Tracking</dt><dd>'+esc(r.tracking_number||'—')+'</dd><dt>Customer notes</dt><dd>'+esc(r.customer_notes||'—')+'</dd>'+(r.flag?'<dt>Flag</dt><dd class="flag">⚑ '+esc(r.flag)+'</dd>':'')+'</dl></div><div class="img">'+img+'</div>';
 document.getElementById('pop').style.display='flex';}
function hide(){document.getElementById('pop').style.display='none'}
document.getElementById('pop').onclick=e=>{if(e.target.id=='pop')hide()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')hide()});
document.getElementById('q').oninput=draw;
setTimeout(()=>location.reload(),15*60*1000);
</script></body></html>
